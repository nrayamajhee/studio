<svg xmlns="http://www.w3.org/2000/svg" width="860" height="298" viewBox="0 0 860 298">
  <text x="24" y="30" fill="#bab8b2" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="15.400000000000002" font-weight="400" text-anchor="start"><tspan x="24" dy="0">A hit</tspan></text>
