  <text x="40" y="98" fill="#bab8b2" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="14.850000000000001" font-weight="400" text-anchor="start"><tspan x="40" dy="0">half-sine pulse: harder</tspan><tspan x="40" dy="19.575">= shorter = brighter</tspan></text>
