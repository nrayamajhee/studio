  <text x="628" y="228" fill="#8ab4f8" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="15.400000000000002" font-weight="600" text-anchor="start"><tspan x="628" dy="0">+ hiss</tspan></text>
  <text x="628" y="247" fill="#bab8b2" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="14.850000000000001" font-weight="400" text-anchor="start"><tspan x="628" dy="0">the brush's bristles</tspan></text>
  <text x="440" y="282" fill="#f3f2ee" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="15.400000000000002" font-weight="400" text-anchor="middle"><tspan x="440" dy="0">× level × velocity → pan → kit bus</tspan></text>
