  <text x="336" y="98" fill="#bab8b2" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="14.850000000000001" font-weight="400" text-anchor="start"><tspan x="336" dy="0">a decaying sine per mode:</tspan><tspan x="336" dy="19.575">f, T60, weight</tspan><tspan x="336" dy="19.575">&#160;</tspan><tspan x="336" dy="19.575">membranes start sharp</tspan><tspan x="336" dy="19.575">and settle (tension),</tspan><tspan x="336" dy="19.575">every 32 samples</tspan></text>
