  <text x="628" y="124" fill="#8ab4f8" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="15.400000000000002" font-weight="600" text-anchor="start"><tspan x="628" dy="0">+ wires</tspan></text>
  <text x="628" y="143" fill="#bab8b2" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="14.850000000000001" font-weight="400" text-anchor="start"><tspan x="628" dy="0">snare, follows the drum</tspan></text>
  <text x="628" y="176" fill="#8ab4f8" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="15.400000000000002" font-weight="600" text-anchor="start"><tspan x="628" dy="0">+ sizzle</tspan></text>
