[package]
name = "web-rust"
authors = ["nrayamajhee <nishan@rayamajhee.com>"]
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fluid = { git = "https://github.com/nrayamajhee/fluid.git" }
fluid-macro = { git = "https://github.com/nrayamajhee/fluid.git" }
gloo-console = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-utils = "0.2"
indexmap = { version = "2", features = ["serde"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sound-engine = { path = "../sound-engine", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AnalyserNode",
  "AudioBuffer",
  "AudioBufferOptions",
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DocumentFragment",
  "DomRect",
  "DomRectList",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "HtmlAnchorElement",
  "History",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlTemplateElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Storage",
  "Url",
  "WheelEvent",
  "Window",
] }

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"
