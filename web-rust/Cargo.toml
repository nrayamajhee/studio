[package]
name = "web-rust"
authors = ["nrayamajhee <nishan@rayamajhee.com>"]
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fluid = { git = "https://github.com/nrayamajhee/fluid.git" }
fluid-macro = { git = "https://github.com/nrayamajhee/fluid.git" }
gloo-console = "0.3"
gloo-timers = "0.3"
gloo-utils = "0.2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document",
  "DocumentFragment",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlTemplateElement",
  "KeyboardEvent",
  "MediaQueryList",
  "Navigator",
  "PointerEvent",
  "Storage",
  "WheelEvent",
  "Window",
] }
