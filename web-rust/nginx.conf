# Serves web-rust's build. The app routes / and /docs/... itself, so a path
# that isn't a file gets the page.
server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/wasm application/javascript text/css image/svg+xml;

  location / {
    try_files $uri /index.html;
  }

  # The page, and the worklet's files, keep their names: check each time.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/sound-worklet\.(js|wasm)$ {
    add_header Cache-Control "no-cache";
  }

  # Trunk names the app's own files by their hash, so they never change.
  location ~ "-[0-9a-f]{16}(_bg)?\.(js|wasm|css|svg)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The crates' Rust docs, as rustdoc wrote them.
  location /rust-doc/ {
    try_files $uri $uri/ =404;
  }

  # The docs' screenshots and diagrams: a missing one is missing.
  location /public/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }
}
